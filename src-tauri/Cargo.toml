[package]
name = "git-helper"
version = "0.1.0"
description = "A safe control room for awkward Git operations"
authors = ["Git Helper"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "git_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-helper-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
